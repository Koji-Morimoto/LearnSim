[package]
version = "0.1.0"
title = "MyExt Geometric Robot (Newton)"
description = "物理ソルバーも Drive も使わず、関節値からリンクの Transform を計算して動かすロボットの Python API に、Newton 1.6.1 の内部 FK (eval_fk) と自前コリジョン空間 (GeometricScene / CollisionPipeline) を統合した拡張機能。Fabric のみの描画でも Play=ON / Stop ともに 0 フレーム遅延で干渉判定・めり込み量・クリアランス計算が可能"
category = "MyExt"
keywords = ["myext", "robot", "kinematics", "articulation", "sublayer", "ik", "collision", "newton", "warp", "dh"]
authors = ["myext"]
readme = "docs/README.md"

[dependencies]
"omni.usd" = {}
"omni.timeline" = {}
"omni.physx" = {}
"omni.usd.schema.physx" = {}
"omni.usd.schema.newton" = {}
"omni.warp.core" = {}
"isaacsim.pip.newton" = {}
"usdrt.scenegraph" = {}
"isaacsim.core.experimental.prims" = {}  # Fabric への一括書き込み
"isaacsim.core.experimental.utils" = {}

[[python.module]]
name = "myext.robot.geometric_newton"

[settings]
# Sublayer を差し込む場所。"session" = Session Layer の下(保存しても元ファイルに混ざらない)、"root" = Root Layer の下
exts."myext.robot.geometric_newton".layer_target = "session"
# layer_target = "root" のときの Sublayer のファイルパス(.usda)
exts."myext.robot.geometric_newton".root_layer_file = ""
# リンクの PhysX コリジョンの扱い。"none" = PhysX 干渉立体を完全無効化(既定・Newton 利用時の最軽量)、"static" = PhysX 静的コライダー、"kinematic" = PhysX kinematic 剛体(Contact Report 用)
exts."myext.robot.geometric_newton".collision_mode = "none"
# リンクの姿勢の書き込み先。"fabric" = Fabric(Newton バックエンドなら USD フラッシュ不要で 0 フレーム遅延)、"usd" = 毎回 USD、"both" = 毎回両方
exts."myext.robot.geometric_newton".write_target = "fabric"
# 回転関節の値の既定の単位。"rad" か "deg"(直動関節はいつも長さ)
exts."myext.robot.geometric_newton".angle_unit = "rad"
# 関節リミット超過時の既定ポリシー。"clip" = 境界でクランプ(超過不可・既定)、"reject" = 指令全体を拒否して前姿勢維持、"warn" = 警告+クランプ、"error" = ValueError、"ignore" = 無視
exts."myext.robot.geometric_newton".limit_policy = "clip"
# 干渉チェックのバックエンド。"newton" = 自前 GeometricScene (0 フレーム遅延・めり込み量・クリアランス対応)、"physx" = PhysX overlap_shape
exts."myext.robot.geometric_newton".collision_backend = "newton"
# 順運動学のバックエンド。"auto" = 単体小型は numpy・バッチ/大規模は Newton GPU、"numpy" = 常に numpy、"newton" = 常に Newton eval_fk
exts."myext.robot.geometric_newton".fk_backend = "auto"
# Newton バックエンドの実行デバイス。"auto" = CUDA があれば "cuda:0" なければ "cpu"
exts."myext.robot.geometric_newton".newton_device = "auto"
# Newton コライダー登録時に UsdGeom.Mesh を単一凸包 (Convex Hull) へ変換するか。
# true (既定) = 単一凸包で高速な GJK/MPR、false = STL 等の元の三角形メッシュそのまま (GeoType.MESH) で判定
exts."myext.robot.geometric_newton".convex_meshes = true
# USD に IsaacRobotAPI が付いている場合、生成・再構築時に GeometricRobotComponent を自動生成するか (既定 true)
exts."myext.robot.geometric_newton".auto_components = true
# VariantSet 経由でぶら下がる子 IsaacRobotAPI を独立コンポーネントにせず親コンポーネントへ取り込むか (既定 false = 従来どおり分離)
exts."myext.robot.geometric_newton".merge_variant_components = false
# デバッグ用: Newton 内部コライダー形状 (通常=シアン・干渉中=赤) と接触点 (オレンジ) を DebugDraw で可視化するか (既定 false = 負荷ゼロ)
exts."myext.robot.geometric_newton".debug_draw_colliders = false
