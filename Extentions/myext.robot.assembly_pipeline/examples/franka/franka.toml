#:schema ../../schema/assembly_pipeline.schema.json
# Franka の腕(panda_arm.urdf、Isaac Sim 同梱)の panda_link8(形も慣性も無いリンク)に、
# 手(panda_hand.urdf。同梱の panda_arm_hand.urdf から手の部分を切り出したもの。指は mimic)を結合する。
# panda_arm_hand.urdf の panda_hand_joint と同じく、手は z 軸まわりに -45 度回して結合する。
output_dir = "../out/franka"                 # 出力先フォルダ(この TOML からの相対パス)

[[urdf_to_usda]]
urdf = "C:/isaacsim-6.2.0/exts/isaacsim.asset.importer.urdf/data/urdf/robots/franka_description/robots/panda_arm.urdf"  # 入力
usda = "panda_arm.usda"                      # 出力: output_dir/panda_arm.usda
ros_package_paths = [{ name = "franka_description", path = "C:/isaacsim-6.2.0/exts/isaacsim.asset.importer.urdf/data/urdf/robots/franka_description" }]

[[urdf_to_usda]]
urdf = "panda_hand.urdf"                     # 入力
usda = "panda_hand.usda"                     # 出力: output_dir/panda_hand.usda
ros_package_paths = [{ name = "franka_description", path = "C:/isaacsim-6.2.0/exts/isaacsim.asset.importer.urdf/data/urdf/robots/franka_description" }]

[[join_file]]
usda = "panda_with_hand.usda"                # 出力: output_dir/panda_with_hand.usda
parent_usda = "panda_arm.usda"               # 入力: 親(上の [[urdf_to_usda]] の usda)

[[join_file.join]]
name = "hand_mount"                          # この結合の名前 = 子を置く prim の名前
child_usda = "panda_hand.usda"               # 入力: 子(上の [[urdf_to_usda]] の usda)
parent_link = "panda_link8"                  # panda_arm.urdf のリンク名
child_link = "panda_hand"                    # panda_hand.urdf のリンク名
offset_rpy = [0.0, 0.0, -0.785398163397]     # panda_link8 の座標系で見た panda_hand の向き(rad)

[probe]
revolute_target = 0.3
