# Franka の腕(panda_arm.urdf、Isaac Sim 同梱)の panda_link8(形も慣性も無いリンク)に、
# 手(panda_hand.urdf。同梱の panda_arm_hand.urdf から手の部分を切り出したもの。指は mimic)を結合する。
# panda_arm_hand.urdf の panda_hand_joint と同じく、手は z 軸まわりに -45 度回して結合する。
output_dir = "../out/franka"

[urdf.panda]
path = "C:/isaacsim-6.2.0/exts/isaacsim.asset.importer.urdf/data/urdf/robots/franka_description/robots/panda_arm.urdf"
ros_package_paths = [{ name = "franka_description", path = "C:/isaacsim-6.2.0/exts/isaacsim.asset.importer.urdf/data/urdf/robots/franka_description" }]

[urdf.hand]
path = "panda_hand.urdf"
ros_package_paths = [{ name = "franka_description", path = "C:/isaacsim-6.2.0/exts/isaacsim.asset.importer.urdf/data/urdf/robots/franka_description" }]

[join_file.franka]
parent = "panda"

[[join_file.franka.join]]
name = "hand"
child = "hand"
parent_link = "panda_link8"
child_link = "panda_hand"
offset_rpy = [0.0, 0.0, -0.785398163397]

[probe]
revolute_target = 0.3
