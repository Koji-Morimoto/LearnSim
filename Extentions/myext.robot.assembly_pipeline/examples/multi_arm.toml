# 4 本アームのロボット。作る usda は 6 つ:
#   base.usda / arm.usda / two_finger.usda / rod.usda : URDF から作る([[urdf_to_usda]])
#   arm_unit.usda : 結合ファイル。arm.usda に、two_finger.usda か rod.usda を VariantSet の選択肢として結合
#   robot.usda    : 結合ファイル。base.usda に arm_unit.usda を 4 回結合し、アームごとにエンドエフェクタを選ぶ
# usda はどこでもファイル名(.usda まで)で指す。「出力」= ここで作る名前、「入力」= どこかの「出力」の名前を書く。

output_dir = "out/multi_arm"                 # 出力先フォルダ(この TOML からの相対パス)

# ---------------------------------------------------------------- URDF → usda
[[urdf_to_usda]]
urdf = "urdf/multi_base.urdf"                # 入力: URDF
usda = "base.usda"                           # 出力: output_dir/base.usda

[[urdf_to_usda]]
urdf = "urdf/arm.urdf"                       # 入力: URDF
usda = "arm.usda"                            # 出力: output_dir/arm.usda

[[urdf_to_usda]]
urdf = "urdf/gripper.urdf"                   # 入力: URDF(二本指のエンドエフェクタ)
usda = "two_finger.usda"                     # 出力: output_dir/two_finger.usda

[[urdf_to_usda]]
urdf = "urdf/tool.urdf"                      # 入力: URDF(棒状のエンドエフェクタ)
usda = "rod.usda"                            # 出力: output_dir/rod.usda

# ---------------------------------------------------------------- 結合ファイル 1: アーム + エンドエフェクタ
[[join_file]]
usda = "arm_unit.usda"                       # 出力: output_dir/arm_unit.usda
parent_usda = "arm.usda"                     # 入力: 親(上の [[urdf_to_usda]] の usda)

[[join_file.join]]
name = "ee_two_finger"                       # この結合の名前(報告の表示と、arm_unit.usda を親にしたときのリンクの前置きに使う)
child_usda = "two_finger.usda"               # 入力: 子(上の [[urdf_to_usda]] の usda)
parent_link = "flange"                       # arm.urdf のリンク名
child_link = "gripper_base"                  # gripper.urdf のリンク名
child_prim_name = "end_effector"             # 出力: 子を置く prim の名前(2 つの選択肢で同じにして、パスを揃える)
variant_set = "EndEffector"                  # 出力: arm_unit.usda の一番上の prim に作る VariantSet の名前
variant = "TwoFinger"                        # 出力: その選択肢の名前(最初の選択肢が既定。"None" は自動で足す)

[[join_file.join]]
name = "ee_rod"
child_usda = "rod.usda"                      # 入力: 子(上の [[urdf_to_usda]] の usda)
parent_link = "flange"                       # arm.urdf のリンク名
child_link = "tool_link"                     # tool.urdf のリンク名
child_prim_name = "end_effector"
variant_set = "EndEffector"                  # 上と同じ VariantSet の、もう 1 つの選択肢
variant = "Rod"

# ---------------------------------------------------------------- 結合ファイル 2: ベース + アーム 4 本
[[join_file]]
usda = "robot.usda"                          # 出力: output_dir/robot.usda
parent_usda = "base.usda"                    # 入力: 親(上の [[urdf_to_usda]] の usda)

[[join_file.join]]
name = "arm1"                                # この結合の名前 = 子を置く prim の名前(child_prim_name を省略)
child_usda = "arm_unit.usda"                 # 入力: 子(上の [[join_file]] の usda)
parent_link = "port1"                        # multi_base.urdf のリンク名
child_link = "base_link"                     # arm_unit.usda の一番上の URDF(arm.urdf)のリンク名

[[join_file.join]]
name = "arm2"
child_usda = "arm_unit.usda"
parent_link = "port2"
child_link = "base_link"
child_variant_selection = { EndEffector = "Rod" }   # 子(arm_unit.usda)の VariantSet "EndEffector" で "Rod" を選ぶ

[[join_file.join]]
name = "arm3"
child_usda = "arm_unit.usda"
parent_link = "port3"
child_link = "base_link"                     # child_variant_selection を省略 = 既定の選択(TwoFinger)

[[join_file.join]]
name = "arm4"
child_usda = "arm_unit.usda"
parent_link = "port4"
child_link = "base_link"
child_variant_selection = { EndEffector = "None" }  # エンドエフェクタを付けない

[probe]
revolute_target = 0.3
