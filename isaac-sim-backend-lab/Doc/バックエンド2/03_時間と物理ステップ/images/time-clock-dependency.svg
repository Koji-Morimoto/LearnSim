<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500">
<defs><marker id="arrow-cdd6f4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cdd6f4"/></marker><marker id="arrow-89b4fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#89b4fa"/></marker><marker id="arrow-a6e3a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a6e3a1"/></marker><marker id="arrow-f38ba8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f38ba8"/></marker><marker id="arrow-f9e2af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9e2af"/></marker></defs>
<rect class="background" x="0" y="0" width="1160" height="500" fill="#1e1e2e"/>
<text x="20" y="42" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#cdd6f4" text-anchor="start" font-weight="bold">図2　時計どうしの従属関係（左の時計が右の時計を決める）</text>
<rect x="20" y="100" width="190" height="200" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="2"/>
<text x="34" y="132" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#cdd6f4" text-anchor="start" font-weight="bold">実時間</text>
<text x="34" y="168" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">壁時計の時間。</text>
<text x="34" y="192" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">Isaac Sim の外で</text>
<text x="34" y="216" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">進む</text>
<rect x="252" y="100" width="190" height="200" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="2"/>
<text x="266" y="132" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#cdd6f4" text-anchor="start" font-weight="bold">メインループの更新</text>
<text x="266" y="168" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">実時間1秒あたりの</text>
<text x="266" y="192" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">回数は、処理の重さ</text>
<text x="266" y="216" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">と、Play 中は timeline</text>
<text x="266" y="240" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">の目標フレームレート</text>
<text x="266" y="264" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">（既定 60）で決まる</text>
<rect x="484" y="100" width="190" height="200" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
<text x="498" y="132" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#cdd6f4" text-anchor="start" font-weight="bold">timeline 時刻</text>
<text x="498" y="168" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">更新1回ごとに</text>
<text x="498" y="192" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">決まった量だけ進む</text>
<text x="498" y="216" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">既定では timeline</text>
<text x="498" y="240" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">時刻で 1/60 秒</text>
<text x="498" y="264" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">間引かれた更新では 0</text>
<rect x="716" y="100" width="190" height="200" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
<text x="730" y="132" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#cdd6f4" text-anchor="start" font-weight="bold">シミュレーション時刻</text>
<text x="730" y="168" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">実行した物理</text>
<text x="730" y="192" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">ステップの回数に</text>
<text x="730" y="216" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">刻み幅を掛けた値</text>
<text x="730" y="240" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">Play 開始時の2回</text>
<text x="730" y="264" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">も含む</text>
<rect x="948" y="100" width="190" height="200" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
<text x="962" y="132" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#cdd6f4" text-anchor="start" font-weight="bold">描画側の時刻</text>
<text x="962" y="168" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">物理ステップの</text>
<text x="962" y="192" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">たびにシミュレー</text>
<text x="962" y="216" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">ション時刻を写す</text>
<line x1="212" y1="175" x2="249" y2="175" stroke="#cdd6f4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-cdd6f4)"/>
<line x1="444" y1="175" x2="481" y2="175" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrow-cdd6f4)"/>
<line x1="676" y1="175" x2="713" y2="175" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrow-cdd6f4)"/>
<line x1="908" y1="175" x2="945" y2="175" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrow-cdd6f4)"/>
<line x1="40" y1="345" x2="100" y2="345" stroke="#cdd6f4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-cdd6f4)"/>
<text x="110" y="350" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">回数（ペース）だけを決める</text>
<line x1="330" y1="345" x2="390" y2="345" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrow-cdd6f4)"/>
<text x="400" y="350" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">値の進みを決める</text>
<rect x="580" y="336" width="18" height="18" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
<text x="606" y="350" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">timeline の時計</text>
<rect x="740" y="336" width="18" height="18" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
<text x="766" y="350" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">物理側の時計</text>
<text x="20" y="402" font-family="Noto Sans JP, sans-serif" font-size="16" fill="#f9e2af" text-anchor="start" font-weight="bold">→ 後ろの時計は前の時計から作られる。ただし手動ステップ step(n) は timeline を通さずにシミュレーション時刻だけを進める</text>
<text x="20" y="434" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">既定の固定刻みでは、実時間は「実時間1秒あたりの更新の回数」だけを決め、timeline 時刻が1回の更新で進む量は決めない</text>
<text x="20" y="462" font-family="Noto Sans JP, sans-serif" font-size="14" fill="#cdd6f4" text-anchor="start">シミュレーション時刻は、timeline 時刻の値そのものではなく、更新ごとの進みの分だけ進む。そのため一度できた差は埋まらない</text>
</svg>
